name: Scheduled Task

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Periodic trigger for testing'
        required: false
        default: 'External scheduler'

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: title
        uses: actions/checkout@v4
        
      - name: Run scheduled task and generate JSON output
        id: main
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EMOJI=$(shuf -e 🎉 🚀 ✨ 🌟 💫 🎊 🎈 ⭐ 🎁 🌈 -n 1)
          echo "hello world"

          # Create JSON output
          JSON_OUTPUT="{\"status\":\"success\",\"message\":\"Scheduled workflow completed successfully\",\"timestamp\":\"$TIMESTAMP\",\"emoji\":\"$EMOJI\",\"repository\":\"${{ github.repository }}\",\"run_id\":\"${{ github.run_id }}\",\"trigger\":\"${{ inputs.trigger_reason }}\"}"

          # Use printf instead of echo to avoid newline issues
          printf 'result=%s\n' "$JSON_OUTPUT" >> $GITHUB_OUTPUT

          ## Create JSON output using heredoc, buggy at command "jq ." in display step
          ## JSON_OUTPUT=$(cat <<EOF
          ## {"status":"success","message":"Scheduled workflow completed successfully","timestamp":"$TIMESTAMP","emoji":"$EMOJI","repository":"${{ github.repository }}","run_id":"${{ github.run_id }}","trigger":"${{ inputs.trigger_reason }}"}
          ## EOF
          ## )

          ## Remove any leading/trailing whitespace
          ## JSON_OUTPUT=$(echo "$JSON_OUTPUT" | tr -d '\n' | sed 's/^[[:space:]]*//g' | sed 's/[[:space:]]*$//g')

          ## Output JSON
          ## echo "result<<EOF" >> $GITHUB_OUTPUT
          ## echo "$JSON_OUTPUT" >> $GITHUB_OUTPUT
          ## echo "EOF" >> $GITHUB_OUTPUT
          ## echo "result=$JSON_OUTPUT" >> $GITHUB_OUTPUT 

      - name: Display completion message
        id: return_result
        run: |
          echo "✅ Job completed!"
          echo "${{ steps.main.outputs.result }}" | jq .
          
      - name: Send success notification to cron-job.org
        if: success()
        run: |
          curl -X POST "${{ secrets.CRONJOBORG_CALLBACK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "message": "${{ steps.main.outputs.result }}",
              "timestamp": "'$TIMESTAMP'",
              "run_id": "${{ github.run_id }}"
            }'

