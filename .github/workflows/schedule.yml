name: Scheduled Task

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Periodic trigger for testing'
        required: false
        default: 'External scheduler'

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: title
        uses: actions/checkout@v4
        
      - name: Run scheduled task and generate JSON output
        id: main
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EMOJI=$(shuf -e 🎉 🚀 ✨ 🌟 💫 🎊 🎈 ⭐ 🎁 🌈 -n 1)
          echo "hello world"
          JSON_OUTPUT=$(cat <<EOF
          {"status":"success","message":"Scheduled workflow completed successfully","timestamp":"$TIMESTAMP","emoji":"$EMOJI","repository":"${{ github.repository }}","run_id":"${{ github.run_id }}","trigger":"${{ inputs.trigger_reason }}"}
          EOF
          )
          printf 'json_output=%s\n' "$JSON_OUTPUT" >> $GITHUB_OUTPUT
          printf 'ts=%s\n' "$TIMESTAMP" >> $GITHUB_OUTPUT
          echo 'icon=$EMOJI' >> $GITHUB_OUTPUT

      - name: Display completion message
        id: return_result
        run: |
          echo "✅ Job completed!"
          jq -n \
            --arg status "success" \
            --arg message "Scheduled workflow completed successfully" \
            --arg timestamp "${{ steps.main.outputs.ts }}" \
            --arg emoji "${{ steps.main.outputs.icon }}" \
            --arg repository "${{ github.repository }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg trigger "${{ inputs.trigger_reason }}" \
            '{"status": $status, "message": $message, "timestamp": $timestamp, "emoji": $emoji, "repository": $repository, "run_id": $run_id, "trigger": $trigger}'
          
      - name: Send success notification to cron-job.org
        id: send_notification
        if: success()
        run: |
          curl -X POST "${{ secrets.CRONJOBORG_CALLBACK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRONJOB_API_KEY }}"
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "message": "${{ steps.main.outputs.json_output }}",
              "timestamp": "${{ steps.main.outputs.ts }}",
              "run_id": "${{ github.run_id }}"
            }'

