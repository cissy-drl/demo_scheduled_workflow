name: Scheduled Task

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Periodic trigger for testing'
        required: false
        default: 'External scheduler'

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run scheduled task
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EMOJI=$(shuf -e 🎉 🚀 ✨ 🌟 💫 🎊 🎈 ⭐ 🎁 🌈 -n 1)
          echo "Timestamp: $TIMESTAMP"
          echo "hello world"
          echo "Emoji: $EMOJI"
